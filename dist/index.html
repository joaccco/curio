:root { color-scheme: dark; }
html, body { background:#05070f; margin:0; }
body { font-family: "Inter","Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
.serif { font-family: "Fraunces","Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif; }
::selection { background:#6366f1; color:#fff; }
.no-scrollbar::-webkit-scrollbar { display:none; }
.no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
@keyframes riseIn { from { opacity:0; transform:translateY(18px) scale(.985); } to { opacity:1; transform:none; } }
@keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
@keyframes popIn { 0%{opacity:0;transform:translateY(10px) scale(.96)} 60%{transform:translateY(-2px) scale(1.005)} 100%{opacity:1;transform:none} }
@keyframes shimmer { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
@keyframes pulseGlow { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:.7;transform:scale(1.06)} }
@keyframes spinSlow { to { transform:rotate(360deg) } }
@keyframes flick { 0%{opacity:0;transform:translateY(6px)} 30%{opacity:1;transform:none} 100%{opacity:0;transform:translateY(-6px)} }
.anim-rise { animation:riseIn .55s cubic-bezier(.2,.8,.2,1) both; }
.anim-fade { animation:fadeIn .4s ease both; }
.anim-pop { animation:popIn .45s cubic-bezier(.2,.8,.2,1) both; }
.anim-flick { animation:flick .45s ease-in-out infinite; }
.spin-slow { animation:spinSlow 1.1s linear infinite; }
.glow { animation:pulseGlow 4.5s ease-in-out infinite; }
.d1{animation-delay:.06s}.d2{animation-delay:.12s}.d3{animation-delay:.18s}.d4{animation-delay:.24s}.d5{animation-delay:.3s}
.grad-text { background:linear-gradient(100deg,#e9d5ff,#a5b4fc,#7dd3fc,#e9d5ff); background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 9s linear infinite; }
.card-sheen { background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02) 45%,rgba(255,255,255,0) 70%); }
.tap { -webkit-tap-highlight-color:transparent; }
#fallback { position:fixed; inset:0; z-index:1; display:flex; align-items:center; justify-content:center; padding:24px; text-align:center; color:#8b95ab; font-size:14px; pointer-events:none; }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important} }

2 0 0 1 2.6 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"})]}),va=[{key:"Ciencia",hue:"from-sky-400/25 to-cyan-300/10",dot:"bg-sky-400",text:"text-sky-300"},{key:"Tecnolog\xEDa",hue:"from-violet-400/25 to-fuchsia-300/10",dot:"bg-violet-400",text:"text-violet-300"},{key:"Filosof\xEDa",hue:"from-amber-400/25 to-orange-300/10",dot:"bg-amber-400",text:"text-amber-300"},{key:"Psicolog\xEDa",hue:"from-rose-400/25 to-pink-300/10",dot:"bg-rose-400",text:"text-rose-300"},{key:"Cultura",hue:"from-emerald-400/25 to-teal-300/10",dot:"bg-emerald-400",text:"text-emerald-300"},{key:"Finanzas",hue:"from-lime-400/25 to-green-300/10",dot:"bg-lime-400",text:"text-lime-300"},{key:"Neurociencia",hue:"from-indigo-400/25 to-blue-300/10",dot:"bg-indigo-400",text:"text-indigo-300"}],ga=e=>va.find(t=>t.key===e)||va[0],dm={Ciencia:[["Teor\xEDa del caos","Sistemas que obedecen reglas simples y deterministas pueden volverse imposibles de predecir. Una diferencia m\xEDnima al inicio termina produciendo un resultado completamente distinto.","Si el mundo fuera determinista pero impredecible, \xBFqu\xE9 significar\xEDa realmente 'predecir'?","intermedio",["Efecto mariposa","Atractores extra\xF1os","Fractales"],"Entrop\xEDa"],["Paradoja de Fermi","El universo es enorme y muy antiguo, con miles de millones de estrellas parecidas al Sol. Si la vida inteligente fuera algo com\xFAn, deber\xEDamos haber detectado alg\xFAn rastro. No detectamos ninguno.","\xBFEs m\xE1s inquietante estar solos, o descubrir que algo impide que las civilizaciones duren?","inicial",["Ecuaci\xF3n de Drake","Gran Filtro","Zona habitable"],"Hip\xF3tesis del multiverso"],["Entrop\xEDa","Es una medida del desorden y de la energ\xEDa que ya no puede usarse para hacer trabajo. En el fondo explica por qu\xE9 el tiempo parece avanzar en una sola direcci\xF3n.","\xBFPor qu\xE9 recordamos el pasado y no el futuro?","intermedio",["Segunda ley de la termodin\xE1mica","Flecha del tiempo","Informaci\xF3n de Shannon"],"Teor\xEDa del caos"],["Experimento de la doble rendija","Part\xEDculas individuales se comportan como ondas y generan un patr\xF3n de interferencia, pero ese patr\xF3n desaparece cuando se intenta observar por d\xF3nde pasaron.","\xBFLa observaci\xF3n crea la realidad o solo revela lo que ya estaba ah\xED?","intermedio",["Dualidad onda-part\xEDcula","Superposici\xF3n","Decoherencia"],"El gato de Schr\xF6dinger"],["Teor\xEDa de cuerdas","Propone que las part\xEDculas fundamentales no son puntos sino filamentos que vibran, y que el universo tendr\xEDa m\xE1s dimensiones de las que percibimos.","\xBFUna teor\xEDa que hoy no puede ponerse a prueba sigue siendo ciencia?","avanzado",["Dimensiones extra","Teor\xEDa M","Supersimetr\xEDa"],"Hip\xF3tesis del multiverso"],["Materia oscura","Las galaxias giran m\xE1s r\xE1pido de lo que su materia visible permitir\xEDa. Algo con masa, que no emite luz, parece componer la mayor parte del universo.","\xBFFalta materia, o falla nuestra teor\xEDa de la gravedad?","intermedio",["Energ\xEDa oscura","Curvas de rotaci\xF3n gal\xE1ctica","Gravedad modificada (MOND)"],"Hip\xF3tesis del multiverso"],["Hip\xF3tesis del multiverso","Nuestro universo podr\xEDa ser uno entre incontables, cada uno con constantes f\xEDsicas distintas. Explicar\xEDa por qu\xE9 las nuestras parecen tan finamente ajustadas.","Si todo lo posible ocurre en alg\xFAn universo, \xBFqu\xE9 vuelve especial a este?","avanzado",["Inflaci\xF3n eterna","Principio antr\xF3pico","Interpretaci\xF3n de muchos mundos"],"Paradoja de Fermi"],["El gato de Schr\xF6dinger","Un experimento mental donde un gato quedar\xEDa vivo y muerto a la vez hasta ser observado. Naci\xF3 como una cr\xEDtica al modelo cu\xE1ntico y termin\xF3 siendo su s\xEDmbolo m\xE1s famoso.","\xBFD\xF3nde termina el mundo cu\xE1ntico y empieza el mundo cotidiano?","inicial",["Superposici\xF3n","Problema de la medici\xF3n","Decoherencia"],"Experimento de la doble rendija"],["Tect\xF3nica de placas","La superficie terrestre est\xE1 partida en placas r\xEDgidas que se desplazan pocos cent\xEDmetros por a\xF1o. Ese movimiento lento levanta monta\xF1as, abre oc\xE9anos y provoca terremotos.","\xBFCu\xE1nto de la historia humana fue moldeado por el movimiento del suelo?","inicial",["Deriva continental","Subducci\xF3n","Pangea"],"Adaptaci\xF3n evolutiva"],["Adaptaci\xF3n evolutiva","Los rasgos que mejoran la supervivencia y la reproducci\xF3n se vuelven m\xE1s frecuentes con el tiempo. No hay un plan: hay variaci\xF3n, filtro y acumulaci\xF3n.","\xBFLa evoluci\xF3n produce dise\xF1os \xF3ptimos o apenas suficientes?","inicial",["Selecci\xF3n natural","Deriva gen\xE9tica","Exaptaci\xF3n"],"Neuroplasticidad"]],Tecnolog\u00EDa:[["Singularidad tecnol\xF3gica","Un punto hipot\xE9tico en el que la inteligencia artificial mejora a s\xED misma m\xE1s r\xE1pido de lo que podemos seguir, y el futuro se vuelve imposible de proyectar.","\xBFPodemos dise\xF1ar algo que despu\xE9s no podamos entender?","intermedio",["Explosi\xF3n de inteligencia","Rendimientos acelerados","Problema de alineaci\xF3n"],"Inteligencia artificial general"],["Sesgo algor\xEDtmico","Un modelo aprende de datos hist\xF3ricos, y esos datos cargan las desigualdades del pasado. El resultado parece objetivo, pero repite decisiones humanas antiguas.","Si un sistema aprende del pasado, \xBFpuede producir un futuro distinto?","inicial",["Datos de entrenamiento","Equidad algor\xEDtmica","Cajas negras"],"Capitalismo de vigilancia"],["Capitalismo de vigilancia","Modelo econ\xF3mico donde la materia prima es tu comportamiento: se registra, se predice y se vende la capacidad de influirlo.","\xBFQu\xE9 precio tiene algo gratis?","intermedio",["Datos de comportamiento","Publicidad dirigida","Privacidad diferencial"],"Econom\xEDa de la atenci\xF3n"],["Ley de Moore","La observaci\xF3n de que la cantidad de transistores en un chip se duplicaba cada dos a\xF1os. Fue menos una ley f\xEDsica que una promesa que la industria decidi\xF3 cumplir.","\xBFQu\xE9 le pasa a una industria construida sobre una promesa de crecimiento cuando esa promesa se agota?","inicial",["Miniaturizaci\xF3n","L\xEDmites f\xEDsicos","Computaci\xF3n paralela"],"Computaci\xF3n cu\xE1ntica"],["Efectos de red","Un producto que vale m\xE1s cuanto m\xE1s gente lo usa. Eso crea una ventaja que se refuerza sola y vuelve casi imposible competir desde afuera.","\xBFCu\xE1ndo un producto deja de competir por calidad y empieza a competir por tama\xF1o?","inicial",["Masa cr\xEDtica","Costos de cambio","Monopolios naturales"],"Econom\xEDas de escala"],["Inteligencia artificial general","Un sistema capaz de aprender y razonar en cualquier dominio, no solo en la tarea para la que fue entrenado. Hoy no existe y no hay acuerdo sobre qu\xE9 tan cerca est\xE1.","\xBFQu\xE9 prueba aceptar\xEDamos como evidencia de comprensi\xF3n real?","intermedio",["Transferencia de aprendizaje","Alineaci\xF3n","Test de Turing"],"Singularidad tecnol\xF3gica"],["Descentralizaci\xF3n mediante blockchain","Un registro compartido que nadie controla individualmente y que permite acordar un estado com\xFAn sin una autoridad central que lo garantice.","\xBFConfiar en un sistema sin autoridad central es realmente confiar menos?","intermedio",["Consenso distribuido","Contratos inteligentes","Trilema de escalabilidad"],"Ciclos de mercado"],["Computaci\xF3n cu\xE1ntica","Usa estados cu\xE1nticos para explorar muchas combinaciones a la vez. Para ciertos problemas espec\xEDficos podr\xEDa hacer en minutos lo que hoy tardar\xEDa siglos.","\xBFQu\xE9 problemas dejar\xEDan de ser imposibles si el tiempo de c\xE1lculo dejara de ser un l\xEDmite?","avanzado",["Qubits","Superposici\xF3n","Correcci\xF3n de errores"],"Experimento de la doble rendija"],["Econom\xEDa de la atenci\xF3n","Cuando la informaci\xF3n es infinita, lo escaso es la atenci\xF3n. Las plataformas compiten por minutos, y ese incentivo termina dise\xF1ando lo que ves.","\xBFElegiste mirar esto, o alguien dise\xF1\xF3 que lo miraras?","inicial",["Refuerzo variable","M\xE9tricas de engagement","Costo de oportunidad"],"V\xEDas de recompensa de la dopamina"],["Desplazamiento laboral por automatizaci\xF3n","La automatizaci\xF3n elimina tareas m\xE1s que oficios completos, pero reparte los costos y los beneficios de manera muy desigual entre trabajadores.","\xBFLa automatizaci\xF3n destruye trabajo o lo redistribuye hacia quienes ya ten\xEDan ventaja?","intermedio",["Falacia ludita","Polarizaci\xF3n del empleo","Renta b\xE1sica universal"],"Estratificaci\xF3n social"]],Filosof\u00EDa:[["Existencialismo","Sostiene que no venimos con una esencia ni un prop\xF3sito dado: primero existimos y despu\xE9s nos definimos con lo que elegimos hacer.","Si nadie te dice qui\xE9n ser, \xBFeso es libertad o abandono?","inicial",["Angustia","Autenticidad","Mala fe"],"Absurdismo"],["Estoicismo","Separa con precisi\xF3n lo que depende de vos de lo que no, y propone poner tu energ\xEDa \xFAnicamente en lo primero. No es indiferencia: es econom\xEDa emocional.","\xBFQu\xE9 parte de lo que te preocupa hoy depende realmente de vos?","inicial",["Dicotom\xEDa del control","Virtud","Amor fati"],"Locus de control"],["Nihilismo","La idea de que la vida no tiene un sentido, un valor o un prop\xF3sito dados de antemano. Puede leerse como derrota o como punto de partida.","Si nada tiene un sentido dado, \xBFel sentido inventado vale menos?","intermedio",["Muerte de Dios","Voluntad de poder","Pesimismo filos\xF3fico"],"Absurdismo"],["Utilitarismo","Una acci\xF3n es correcta si produce el mayor bienestar para la mayor cantidad de personas. Simple de enunciar, inc\xF3modo de aplicar.","\xBFPuede una decisi\xF3n correcta dejar v\xEDctimas?","inicial",["C\xE1lculo de utilidad","Consecuencialismo","Deontolog\xEDa"],"El problema del tranv\xEDa"],["Contrato social","La autoridad pol\xEDtica no vendr\xEDa de la naturaleza ni de lo divino, sino de un acuerdo entre personas que ceden algo de libertad a cambio de orden.","\xBFAlguna vez firmaste el acuerdo que te obliga a obedecer?","intermedio",["Estado de naturaleza","Legitimidad","Voluntad general"],"Estratificaci\xF3n social"],["Determinismo vs. libre albedr\xEDo","\xBFNuestras decisiones son realmente libres, o est\xE1n determinadas por la gen\xE9tica, el entorno y todo lo que ocurri\xF3 antes? La discusi\xF3n atraviesa f\xEDsica, biolog\xEDa y derecho.","Si cada decisi\xF3n tiene una causa previa, \xBFen qu\xE9 momento aparece la libertad?","intermedio",["Compatibilismo","Causalidad","Responsabilidad moral"],"Dualismo vs. materialismo"],["Relativismo moral","Sostiene que los juicios morales solo son v\xE1lidos dentro de un marco cultural o personal, y que no habr\xEDa un criterio neutral para arbitrar entre ellos.","\xBFExiste alguna pr\xE1ctica que estar\xEDas dispuesto a condenar en cualquier cultura?","intermedio",["Universalismo moral","Etnocentrismo","Objetivismo \xE9tico"],"Relativismo cultural"],["Absurdismo","Nace del choque entre nuestra necesidad de sentido y un universo que no lo ofrece. Camus propone no resolver esa tensi\xF3n sino vivirla con lucidez.","\xBFSe puede vivir plenamente sin respuestas?","intermedio",["Mito de S\xEDsifo","Suicidio filos\xF3fico","Rebeld\xEDa"],"Nihilismo"],["Dualismo vs. materialismo","\xBFLa mente es algo distinto del cuerpo, o es enteramente producto de procesos f\xEDsicos? De la respuesta dependen ideas sobre identidad, muerte y conciencia.","\xBFLa experiencia de leer esto es solo qu\xEDmica, o algo m\xE1s?","avanzado",["Problema mente-cuerpo","Qualia","Problema dif\xEDcil de la conciencia"],"Red neuronal por defecto"],["El problema del tranv\xEDa","Un experimento mental sobre sacrificar a una persona para salvar a cinco. Sirve menos para dar respuestas que para exponer c\xF3mo razonamos moralmente.","\xBFPor qu\xE9 se siente distinto accionar una palanca que empujar a alguien?","inicial",["Doctrina del doble efecto","Intuici\xF3n moral","Utilitarismo"],"Utilitarismo"]],Psicolog\u00EDa:[["Proyecci\xF3n","Atribuir a otros los impulsos, defectos o deseos que no toleramos en nosotros mismos. Suele delatarse por la intensidad desproporcionada de la reacci\xF3n.","\xBFQu\xE9 te molesta en otras personas con una intensidad que no termina de justificarse?","inicial",["Mecanismos de defensa","Sombra junguiana","Transferencia"],"Sesgo de confirmaci\xF3n"],["Mentalidad de escasez","Cuando algo falta \u2014dinero, tiempo, afecto\u2014 la atenci\xF3n se estrecha alrededor de esa falta y empeora la calidad de todas las dem\xE1s decisiones.","\xBFCu\xE1ntas decisiones tomaste hoy por miedo a perder algo?","inicial",["Ancho de banda cognitivo","Aversi\xF3n a la p\xE9rdida","Descuento temporal"],"Costo de oportunidad"],["S\xEDndrome del impostor","La sensaci\xF3n persistente de no merecer los propios logros y de estar por ser descubierto, incluso frente a evidencia objetiva de competencia.","\xBFPor qu\xE9 el \xE9xito propio se explica por suerte y el ajeno por talento?","inicial",["Efecto Dunning-Kruger","Estilo atributivo","Autoeficacia"],"Sesgo de autoservicio"],["Indefensi\xF3n aprendida","Tras repetidas experiencias sin control sobre el resultado, se deja de intentar incluso cuando la salida ya est\xE1 disponible.","\xBFCu\xE1ntas puertas dejaste de probar porque alguna vez estuvieron cerradas?","intermedio",["Locus de control","Estilo atributivo","Motivaci\xF3n"],"Locus de control"],["Disonancia cognitiva","La incomodidad de sostener dos ideas incompatibles, o de actuar en contra de lo que se cree. Se resuelve casi siempre cambiando la creencia, no la conducta.","\xBFCambiaste alguna vez tu opini\xF3n para no tener que cambiar tu conducta?","inicial",["Justificaci\xF3n del esfuerzo","Racionalizaci\xF3n","Teor\xEDa de la autopercepci\xF3n"],"Sesgo de confirmaci\xF3n"],["Sesgo de confirmaci\xF3n","Buscamos, recordamos e interpretamos informaci\xF3n de manera que confirme lo que ya creemos. No es mentir: es filtrar sin darse cuenta.","\xBFCu\xE1ndo fue la \xFAltima vez que buscaste evidencia en contra de algo que cre\xE9s?","inicial",["Razonamiento motivado","C\xE1mara de eco","Falsaci\xF3n"],"Sesgo algor\xEDtmico"],["Teor\xEDa del apego","Los v\xEDnculos tempranos dejan un modelo interno sobre qu\xE9 esperar de los dem\xE1s, y ese modelo sigue operando en las relaciones adultas.","\xBFCu\xE1nto de tu forma de vincularte se decidi\xF3 antes de que pudieras recordarlo?","intermedio",["Apego seguro","Modelo interno de trabajo","Regulaci\xF3n emocional"],"Poda sin\xE1ptica"],["Locus de control","Grado en que alguien percibe que los resultados de su vida dependen de sus acciones o de fuerzas externas. Predice persistencia, salud y bienestar.","\xBFTus resultados dependen m\xE1s de vos o de las circunstancias?","inicial",["Autoeficacia","Indefensi\xF3n aprendida","Atribuci\xF3n causal"],"Estoicismo"],["Sesgo de autoservicio","Atribuimos los \xE9xitos a nuestras cualidades y los fracasos a factores externos. Protege la autoestima al costo de la precisi\xF3n.","\xBFA qui\xE9n le atribuiste tu \xFAltimo fracaso?","inicial",["Error fundamental de atribuci\xF3n","Autoestima","Sesgo retrospectivo"],"Efecto halo"],["Efecto halo","Una impresi\xF3n positiva en un rasgo contamina la evaluaci\xF3n de todos los dem\xE1s. Alguien que se ve seguro nos parece adem\xE1s competente y honesto.","\xBFCu\xE1ntas veces confundiste seguridad con competencia?","inicial",["Primera impresi\xF3n","Sesgo de atractivo","Heur\xEDstica de disponibilidad"],"Se\xF1alizaci\xF3n de estatus"]],Cultura:[["Capital cultural","Conocimientos, gustos y modales que se heredan del entorno y funcionan como una moneda invisible: abren puertas sin que nadie mencione el precio.","\xBFQu\xE9 sab\xE9s hacer que nunca aprendiste conscientemente?","intermedio",["Habitus","Distinci\xF3n","Reproducci\xF3n social"],"Estratificaci\xF3n social"],["Poder blando","La capacidad de un pa\xEDs de conseguir lo que quiere por atracci\xF3n y no por coerci\xF3n: cine, m\xFAsica, universidades, comida, idioma.","\xBFQu\xE9 te hizo desear algo de un pa\xEDs que nunca visitaste?","inicial",["Diplomacia cultural","Industrias creativas","Hegemon\xEDa"],"Globalizaci\xF3n"],["Orientalismo","La cr\xEDtica de Edward Said al modo en que Occidente construy\xF3 a 'Oriente' como un objeto ex\xF3tico y atrasado, y a c\xF3mo esa representaci\xF3n justific\xF3 el dominio.","\xBFQui\xE9n escribe la historia de los que no la escriben?","avanzado",["Poscolonialismo","Otredad","Representaci\xF3n"],"Relativismo cultural"],["Sociedades colectivistas vs. individualistas","Algunas culturas ubican la identidad en el grupo y otras en el individuo. Eso cambia c\xF3mo se decide, se negocia y se entiende el \xE9xito.","\xBFTus decisiones importantes son tuyas o de tu grupo?","inicial",["Dimensiones de Hofstede","Cultura del honor","Identidad social"],"Relativismo cultural"],["Estratificaci\xF3n social","La distribuci\xF3n sistem\xE1tica y persistente de recursos, prestigio y poder entre grupos. Rara vez es solo cuesti\xF3n de esfuerzo individual.","\xBFCu\xE1nto de tu posici\xF3n actual estaba decidido al nacer?","intermedio",["Movilidad social","Clase","Meritocracia"],"Capital cultural"],["Evoluci\xF3n de los est\xE1ndares de belleza","Lo que se considera hermoso cambia con la econom\xEDa, la tecnolog\xEDa y el poder. Cada \xE9poca naturaliza su propio ideal como si fuera universal.","\xBFQu\xE9 te parece hermoso hoy que hace cien a\xF1os habr\xEDa resultado indiferente?","inicial",["Construcci\xF3n social","Se\xF1alizaci\xF3n de estatus","Industria cosm\xE9tica"],"Se\xF1alizaci\xF3n de estatus"],["Subculturas","Grupos que construyen c\xF3digos propios frente a la cultura dominante. Casi siempre terminan siendo absorbidos y vendidos por aquello que rechazaban.","\xBFQu\xE9 grupo te defini\xF3 m\xE1s: el que elegiste o el que te toc\xF3?","inicial",["Identidad social","Contracultura","Cooptaci\xF3n comercial"],"Capital cultural"],["Relativismo cultural","Propone entender cada pr\xE1ctica dentro de su propio contexto antes de juzgarla. La discusi\xF3n empieza cuando entender parece implicar aprobar.","\xBFSe puede entender una pr\xE1ctica sin justificarla?","intermedio",["Etnocentrismo","Universalismo","M\xE9todo etnogr\xE1fico"],"Relativismo moral"],["Globalizaci\xF3n","La integraci\xF3n creciente de econom\xEDas, culturas y poblaciones. Acerca bienes e ideas, pero reparte de forma muy despareja las ganancias.","\xBFEl mundo se volvi\xF3 m\xE1s parecido o m\xE1s desigual?","intermedio",["Cadenas globales de valor","Homogeneizaci\xF3n cultural","Glocalizaci\xF3n"],"Poder blando"],["Se\xF1alizaci\xF3n de estatus","Buena parte del consumo no busca utilidad sino comunicar posici\xF3n. Cuando una se\xF1al se vuelve accesible, el grupo de arriba cambia de se\xF1al.","\xBFQu\xE9 compr\xE1s para que otros vean algo de vos?","inicial",["Consumo conspicuo","Teor\xEDa de se\xF1ales","Bienes posicionales"],"Capital cultural"]],Finanzas:[["Objetivos de inflaci\xF3n","Muchos bancos centrales apuntan a una inflaci\xF3n baja y estable, en torno al 2%. La idea es anclar expectativas m\xE1s que controlar precios uno por uno.","\xBFPor qu\xE9 un banco central querr\xEDa que los precios suban un poco?","intermedio",["Pol\xEDtica monetaria","Expectativas","Tasa de inter\xE9s"],"Flexibilizaci\xF3n cuantitativa"],["Flexibilizaci\xF3n cuantitativa","Cuando bajar la tasa ya no alcanza, el banco central compra activos para inyectar liquidez. El efecto sobre precios de activos suele ser mayor que sobre la econom\xEDa real.","Si se puede crear dinero, \xBFpor qu\xE9 sigue existiendo la escasez?","avanzado",["Base monetaria","Precio de activos","Trampa de liquidez"],"Burbujas de activos"],["Burbujas de activos","El precio se despega del valor y sube porque sube, sostenido por la expectativa de vender m\xE1s caro. Solo se confirma cuando ya explot\xF3.","\xBFC\xF3mo se distingue una burbuja de un cambio real de valor, antes de que estalle?","intermedio",["Exuberancia irracional","Man\xEDa especulativa","Reversi\xF3n a la media"],"Finanzas conductuales"],["Costo de oportunidad","El verdadero costo de algo es lo mejor que dej\xE1s de hacer para hacerlo. Es el concepto econ\xF3mico m\xE1s simple y el m\xE1s ignorado.","\xBFQu\xE9 est\xE1s dejando de hacer ahora mismo?","inicial",["Escasez","An\xE1lisis marginal","Costo hundido"],"Mentalidad de escasez"],["Efectos de red","En finanzas, explica valuaciones que parecen absurdas: el negocio que concentra usuarios captura un valor desproporcionado frente al segundo.","\xBFPor qu\xE9 el segundo mejor producto puede valer diez veces menos?","intermedio",["Ventaja del primero","Valuaci\xF3n","Poder de mercado"],"Econom\xEDas de escala"],["Econom\xEDas de escala","Producir m\xE1s puede reducir el costo por unidad, hasta que la coordinaci\xF3n se vuelve m\xE1s cara que el ahorro y aparece el efecto inverso.","\xBFPor qu\xE9 crecer puede volver a una empresa m\xE1s barata y m\xE1s fr\xE1gil a la vez?","inicial",["Costo marginal","Deseconom\xEDas de escala","Integraci\xF3n vertical"],"Ciclos de mercado"],["Ciclos de mercado","Expansi\xF3n, euforia, contracci\xF3n y p\xE1nico se repiten con notable regularidad, impulsados por cr\xE9dito y psicolog\xEDa colectiva m\xE1s que por fundamentos.","\xBFPor qu\xE9 todos saben que el ciclo existe y casi nadie lo anticipa?","intermedio",["Ciclo del cr\xE9dito","Indicadores adelantados","Efecto manada"],"Finanzas conductuales"],["Finanzas conductuales","Estudia c\xF3mo los sesgos cognitivos y las emociones producen decisiones financieras sistem\xE1ticamente irracionales, y predecibles.","\xBFSos un inversor racional o un animal con una hoja de c\xE1lculo?","intermedio",["Aversi\xF3n a la p\xE9rdida","Contabilidad mental","Efecto manada"],"Disonancia cognitiva"],["Prima de riesgo","El retorno extra que se exige por asumir incertidumbre. Cu\xE1nto hay que pagarte para que aceptes la posibilidad de perder.","\xBFCu\xE1nto te tienen que pagar para que aceptes no dormir tranquilo?","intermedio",["Tasa libre de riesgo","Volatilidad","Diversificaci\xF3n"],"Inter\xE9s compuesto"],["Inter\xE9s compuesto","Los rendimientos generan rendimientos. El resultado depende menos del monto inicial que de la tasa y, sobre todo, del tiempo.","\xBFPor qu\xE9 el tiempo vale m\xE1s que el monto?","inicial",["Crecimiento exponencial","Horizonte temporal","Descuento temporal"],"Prima de riesgo"]],Neurociencia:[["Neuroplasticidad","El cerebro reorganiza sus conexiones seg\xFAn lo que se usa y lo que no. Cambia con la experiencia durante toda la vida, no solo en la infancia.","Si el cerebro cambia con lo que repet\xEDs, \xBFqu\xE9 est\xE1s entrenando sin darte cuenta?","inicial",["Aprendizaje hebbiano","Poda sin\xE1ptica","Neurog\xE9nesis"],"Poda sin\xE1ptica"],["V\xEDas de recompensa de la dopamina","La dopamina se asocia menos al placer que al deseo y a la anticipaci\xF3n. Se\xF1ala 'esto podr\xEDa valer la pena' y sostiene la b\xFAsqueda.","\xBFLa dopamina te da placer, o te mantiene buscando?","inicial",["Refuerzo variable","N\xFAcleo accumbens","Error de predicci\xF3n de recompensa"],"Econom\xEDa de la atenci\xF3n"],["Neuronas espejo","Neuronas que se activan tanto al ejecutar una acci\xF3n como al ver a otro ejecutarla. Su rol exacto en la empat\xEDa sigue siendo discutido.","\xBFD\xF3nde termina tu experiencia y empieza la del otro?","intermedio",["Empat\xEDa","Imitaci\xF3n","Cognici\xF3n social"],"Teor\xEDa del apego"],["Secuestro de la am\xEDgdala","Ante una amenaza percibida, la respuesta emocional se adelanta al razonamiento y la corteza prefrontal queda moment\xE1neamente fuera de juego.","\xBFCu\xE1ntas decisiones importantes tomaste en modo alarma?","inicial",["Respuesta de lucha o huida","Corteza prefrontal","Regulaci\xF3n emocional"],"Respuesta de lucha o huida"],["Red neuronal por defecto","Un conjunto de regiones que se activa cuando no est\xE1s enfocado en nada: recuerdos, planes, autorreferencia. Es el cerebro hablando solo.","\xBFQui\xE9n sos cuando no est\xE1s haciendo nada?","intermedio",["Divagaci\xF3n mental","Autorreferencia","Meditaci\xF3n"],"Dualismo vs. materialismo"],["Poda sin\xE1ptica","El cerebro elimina conexiones poco usadas para fortalecer las que importan. Aprender es, en buena medida, descartar.","\xBFY si aprender fuera sobre todo eliminar?","intermedio",["Neuroplasticidad","Desarrollo adolescente","Mielinizaci\xF3n"],"Neuroplasticidad"],["Lateralizaci\xF3n cerebral","Los hemisferios tienen especializaciones reales, pero la idea de personas 'de hemisferio izquierdo o derecho' es una simplificaci\xF3n sin respaldo.","\xBFPor qu\xE9 sobreviven los mitos aun cuando la evidencia los contradice?","inicial",["Cuerpo calloso","Cerebro dividido","Especializaci\xF3n hemisf\xE9rica"],"Sesgo de confirmaci\xF3n"],["Neurog\xE9nesis","La formaci\xF3n de neuronas nuevas en el cerebro adulto, principalmente en el hipocampo. Su alcance real en humanos sigue en debate activo.","\xBFCu\xE1nto de tu cerebro es el mismo que hace un a\xF1o?","intermedio",["Hipocampo","Ejercicio y cognici\xF3n","Neuroplasticidad"],"Neuroplasticidad"],["Respuesta de lucha o huida","Una cascada fisiol\xF3gica pensada para emergencias f\xEDsicas breves, que hoy se dispara ante correos, deudas y conversaciones pendientes.","\xBFTu cuerpo distingue entre un depredador y un mensaje sin responder?","inicial",["Sistema nervioso simp\xE1tico","Adrenalina","Regulaci\xF3n del cortisol"],"Regulaci\xF3n del cortisol"],["Regulaci\xF3n del cortisol","El cortisol sigue un ritmo diario y sube ante el estr\xE9s. El problema no es la subida sino que el sistema de emergencia no vuelva a apagarse.","\xBFQu\xE9 le pasa a un sistema de emergencia que nunca se apaga?","intermedio",["Eje HHA","Estr\xE9s cr\xF3nico","Ritmo circadiano"],"Neurog\xE9nesis"]]},ud=e=>e.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""),pm={inicial:5,intermedio:15,avanzado:30},Nt=Object.entries(dm).flatMap(([e,t])=>t.map(([n,r,o,i,l,a])=>({id:`${ud(e)}--${ud(n)}`,category:e,title:n,desc:r,question:o,level:i,related:l,next:a,minutes:pm[i]}))),cd=[{key:"sorpresa",label:"Algo que me sorprenda",cats:[]},{key:"mente",label:"Entender c\xF3mo funciona mi mente",cats:["Psicolog\xEDa","Neurociencia"]},{key:"vida",label:"Pensar sobre la vida",cats:["Filosof\xEDa"]},{key:"futuro",label:"Comprender el futuro",cats:["Tecnolog\xEDa","Ciencia"]},{key:"dinero",label:"Aprender sobre dinero",cats:["Finanzas"]},{key:"sociedad",label:"Conocer mejor la sociedad",cats:["Cultura","Filosof\xEDa"]},{key:"universo",label:"Explorar el universo",cats:["Ciencia"]}],fm=[{key:"rapida",label:"Exploraci\xF3n r\xE1pida",hint:"Fundamentos en ~5 minutos"},{key:"profunda",label:"Investigaci\xF3n profunda",hint:"Conceptos, autores, evidencia y cr\xEDticas"},{key:"debate",label:"Debate cr\xEDtico",hint:"Posturas opuestas y conclusi\xF3n propia"}];function dd(e,t,n){if(!e)return"";let r=e.title,o=e.category,i=e.question,a=`
Conceptos que quiero que aparezcan s\xED o s\xED: ${e.related.join(", ")}.
Pregunta que quiero poder responder al terminar: \u201C${i}\u201D.`,s={rapida:[`Quiero entender los fundamentos del tema \u201C${r}\u201D, del \xE1rea de \u201C${o}\u201D, en unos 5 minutos de lectura.

1. Explic\xE1melo en un p\xE1rrafo, como si no supiera absolutamente nada del tema.
2. Dame las 3 ideas centrales que necesito para no perderme.
3. Us\xE1 una analog\xEDa concreta de la vida cotidiana.
4. Contame un ejemplo real donde esto se vea funcionando.
5. Decime cu\xE1l es el error m\xE1s com\xFAn que comete la gente al entenderlo.
6. Cerr\xE1 con una sola frase que resuma por qu\xE9 esto importa.

S\xE9 claro y directo. Evit\xE1 tecnicismos sin explicar. Si hay algo en discusi\xF3n, avis\xE1melo en una l\xEDnea.${a}`,`Necesito una introducci\xF3n r\xE1pida y honesta a \u201C${r}\u201D (\xE1rea: ${o}). Tengo cinco minutos.

1. Definilo en dos oraciones, sin jerga.
2. Explic\xE1 qu\xE9 problema vino a resolver o qu\xE9 observaci\xF3n lo origin\xF3.
3. Mostr\xE1 c\xF3mo se ve esto en un caso concreto y cotidiano.
4. Aclarame dos malentendidos frecuentes.
5. Decime qu\xE9 parte est\xE1 bien establecida y qu\xE9 parte todav\xEDa se discute.
6. Termin\xE1 con una idea que me deje pensando.

Prioriz\xE1 precisi\xF3n sobre entusiasmo. No infles la explicaci\xF3n.${a}`],profunda:[`Quiero investigar el tema \u201C${r}\u201D, perteneciente al \xE1rea de \u201C${o}\u201D.
Explic\xE1melo de forma clara, rigurosa y progresiva.

1. Defin\xED el concepto con palabras simples.
2. Explic\xE1 su origen y contexto hist\xF3rico.
3. Present\xE1 sus principales teor\xEDas, autores o descubrimientos.
4. Inclu\xED ejemplos concretos y aplicaciones en la vida real.
5. Mostr\xE1 las principales cr\xEDticas, limitaciones o controversias.
6. Diferenci\xE1 hechos comprobados, teor\xEDas e hip\xF3tesis.
7. Relacion\xE1 el tema con otras \xE1reas del conocimiento.
8. Haceme tres preguntas para comprobar qu\xE9 entend\xED.
9. Recomendame qu\xE9 deber\xEDa investigar despu\xE9s.

Evit\xE1 explicaciones superficiales. Cuando existan desacuerdos cient\xEDficos o acad\xE9micos, present\xE1 las distintas posiciones.${a}`,`Actu\xE1 como un especialista en ${o} y armame un recorrido completo sobre \u201C${r}\u201D.

1. Empez\xE1 por la definici\xF3n precisa y por c\xF3mo se distingue de conceptos vecinos.
2. Reconstru\xED su desarrollo hist\xF3rico y los momentos que lo cambiaron.
3. Nombr\xE1 autores, trabajos o experimentos clave, con el aporte de cada uno.
4. Explic\xE1 los mecanismos: no solo qu\xE9 es, sino c\xF3mo funciona.
5. Mostr\xE1 qu\xE9 evidencia lo sostiene y qu\xE9 tan s\xF3lida es.
6. Detall\xE1 cr\xEDticas serias, l\xEDmites y casos donde el marco falla.
7. Separ\xE1 expl\xEDcitamente lo comprobado, lo te\xF3rico y lo especulativo.
8. Conectalo con al menos dos disciplinas distintas.
9. Cerr\xE1 con tres preguntas de comprensi\xF3n y una ruta de estudio con pr\xF3ximos pasos.

No simplifiques al punto de distorsionar. Si algo est\xE1 en disputa, mostr\xE1 qui\xE9n sostiene qu\xE9 y por qu\xE9.${a}`],debate:[`Quiero analizar cr\xEDticamente el tema \u201C${r}\u201D (\xE1rea: ${o}) para formarme una opini\xF3n propia.

1. Formul\xE1 con precisi\xF3n la pregunta central en disputa.
2. Present\xE1 la postura A con sus mejores argumentos y su evidencia m\xE1s fuerte.
3. Present\xE1 la postura B con exactamente la misma seriedad.
